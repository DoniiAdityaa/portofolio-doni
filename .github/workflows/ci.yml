name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving "latest" calls the GitHub API and can hit its rate limit.
          # Keep in step with the local CLI (`supabase --version`).
          version: 3.2.0
      # From M5 the public pages read Supabase, also while prerendering at build time.
      - run: supabase start -x studio,edge-runtime,imgproxy,vector,logflare,supavisor,mailpit,postgres-meta
      - name: Point the app at local Supabase
        run: |
          supabase status -o env \
            | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p; s/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
          # Throwaway values for CI only; production secrets live in Vercel.
          echo "VISITOR_HASH_SALT=ci-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=ci-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: pnpm build

  database:
    name: Database (migrations, seed, RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving "latest" calls the GitHub API and can hit its rate limit.
          # Keep in step with the local CLI (`supabase --version`).
          version: 3.2.0
      # Applies every migration and the seed from scratch, so a broken migration fails here.
      - run: supabase start -x studio,edge-runtime,imgproxy,vector,logflare,supavisor,mailpit,postgres-meta
      - run: supabase test db

  e2e:
    name: End-to-end tests
    # Case 03: E2E runs on Pull Requests to main.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving "latest" calls the GitHub API and can hit its rate limit.
          # Keep in step with the local CLI (`supabase --version`).
          version: 3.2.0
      # From M5 the public pages read Supabase, also while prerendering at build time.
      - run: supabase start -x studio,edge-runtime,imgproxy,vector,logflare,supavisor,mailpit,postgres-meta
      - name: Point the app at local Supabase
        run: |
          supabase status -o env \
            | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p; s/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
          # Throwaway values for CI only; production secrets live in Vercel.
          echo "VISITOR_HASH_SALT=ci-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=ci-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
